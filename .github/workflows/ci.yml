name: public-alpha

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: ruff check src tests scripts browser-tests
      - run: python -m build --sdist --wheel
      - run: twine check dist/*
      - run: python scripts/verify_source_manifest.py
      - run: python scripts/verify_distribution.py dist/*
      - name: Installed workflow smoke
        run: |
          python -m venv /tmp/modelforge-installed
          /tmp/modelforge-installed/bin/pip install --no-deps dist/*.whl
          state=$(mktemp -d)
          cd /tmp
          poison=$(mktemp -d)
          mkdir "$poison/modelforge"
          printf 'PRIVATE_SENTINEL = True\n' > "$poison/modelforge/__init__.py"
          PYTHONPATH="$poison" PYTHONNOUSERSITE=1 /tmp/modelforge-installed/bin/python -c \
            'import modelforge, modelforge_workbench; assert modelforge.PRIVATE_SENTINEL'
          PYTHONPATH="$poison" PYTHONNOUSERSITE=1 /tmp/modelforge-installed/bin/modelforge demo run --state-root "$state"
          PYTHONNOUSERSITE=1 /tmp/modelforge-installed/bin/modelforge runs list --state-root "$state"

  browser-journeys:
    name: browser-journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install locked Playwright video helper
        run: npx playwright install ffmpeg
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m build --wheel
      - name: Install built candidate
        run: |
          python -m venv /tmp/modelforge-browser-installed
          /tmp/modelforge-browser-installed/bin/pip install --no-deps dist/*.whl
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Run public browser journeys
        env:
          MODELFORGE_TEST_PYTHON: /tmp/modelforge-browser-installed/bin/python
          MODELFORGE_BROWSER_CHANNEL: chrome
        run: npm run test:browser
      - name: Retain bounded browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-alpha-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ModelForge tree, history, metadata, and workspace policy scan
        run: python scripts/scan_public_candidate.py
      - name: Independent Gitleaks history scan
        run: |
          mkdir /tmp/modelforge-gitleaks
          curl --fail --silent --show-error --location \
            --output /tmp/modelforge-gitleaks/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/modelforge-gitleaks/gitleaks.tar.gz' \
            | sha256sum --check --status
          tar -xzf /tmp/modelforge-gitleaks/gitleaks.tar.gz \
            -C /tmp/modelforge-gitleaks gitleaks
          /tmp/modelforge-gitleaks/gitleaks git --no-banner --redact --exit-code 1 .

  release-gate:
    name: release-gate
    if: always()
    needs: [test-build, browser-journeys, secret-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every publication prerequisite check
        env:
          TEST_BUILD: ${{ needs.test-build.result }}
          BROWSER_JOURNEYS: ${{ needs.browser-journeys.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          test "$TEST_BUILD" = success
          test "$BROWSER_JOURNEYS" = success
          test "$SECRET_SCAN" = success
